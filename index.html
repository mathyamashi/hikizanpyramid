<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUKU STAR (九九スター)</title>
    <!-- Web Clip / PWA Support for iOS and Mobiles -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" href="./apple-touch-icon.png">
    <link rel="manifest" href="./site.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="九九スター">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"M PLUS Rounded 1c"', 'ui-sans-serif', 'system-ui'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fffaf0; /* orange-50 */
            color: #334155; /* slate-800 */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
            読み込み中... (しばらくお待ちください)
        </div>
    </div>

    <!-- Libraries with fallback -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // アニメーションライブラリの安全な読み込み
        const getMotion = () => {
            const M = window.Motion || window.FramerMotion;
            if (M && M.motion) {
                return { motion: M.motion, AnimatePresence: M.AnimatePresence };
            }
            return {
                motion: {
                    div: 'div', button: 'button', h1: 'h1', p: 'p', span: 'span',
                    nav: 'nav', section: 'section', header: 'header'
                },
                AnimatePresence: ({ children }) => <React.Fragment>{children}</React.Fragment>
            };
        };

        const { motion, AnimatePresence } = getMotion();

        const LEVEL_CONFIG = {
            1: { color: 'bg-rose-400', name: '1のだん', icon: '🍎' },
            2: { color: 'bg-orange-400', name: '2のだん', icon: '🐱' },
            3: { color: 'bg-amber-400', name: '3のだん', icon: '🐤' },
            4: { color: 'bg-emerald-400', name: '4のだん', icon: '🍀' },
            5: { color: 'bg-blue-400', name: '5のだん', icon: '🐬' },
            6: { color: 'bg-indigo-400', name: '6のだん', icon: '☂️' },
            7: { color: 'bg-violet-400', name: '7のだん', icon: '🌈' },
            8: { color: 'bg-fuchsia-400', name: '8のだん', icon: '🐙' },
            9: { color: 'bg-pink-400', name: '9のだん', icon: '🍦' },
            10: { color: 'bg-teal-400', name: '10のだん', icon: '✨' },
            100: { color: 'bg-cyan-400', name: '100のだん', icon: '🌌' },
            'random_1x1': { color: 'bg-slate-700', name: '1けた×1けた', icon: '🎲' },
            'random_2x1': { color: 'bg-indigo-600', name: '2けた×1けた', icon: '🚀' },
        };

        function App() {
            const [view, setView] = useState('menu');
            const [isReady, setIsReady] = useState(false);
            const [volume, setVolume] = useState(50); // 音量 (0-100)
            const lastQuestionKey = useRef(null);
            const audioCtxRef = useRef(null);

            // AudioContextの初期化と再開
            const ensureAudioContext = () => {
                try {
                    if (!audioCtxRef.current) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) {
                            audioCtxRef.current = new AudioContext();
                        }
                    }
                    if (audioCtxRef.current) {
                        if (audioCtxRef.current.state === 'suspended') {
                            audioCtxRef.current.resume();
                        }
                        // iOS/Safari向けのアンロック処理: ダミー音を鳴らす
                        // ユーザー操作の直後の同期的なコンテキストで実行する必要がある
                        const buffer = audioCtxRef.current.createBuffer(1, 1, 22050);
                        const source = audioCtxRef.current.createBufferSource();
                        source.buffer = buffer;
                        source.connect(audioCtxRef.current.destination);
                        source.start(0);
                    }
                } catch (e) {
                    console.error("AudioContext initialization failed", e);
                }
                return audioCtxRef.current;
            };

            // 効果音（Web Audio API）
            const playEffect = (type, currentVolume = volume) => {
                try {
                    const ctx = ensureAudioContext();
                    if (!ctx) return;
                    
                    // マスターボリューム
                    const masterGain = ctx.createGain();
                    masterGain.gain.setValueAtTime(currentVolume / 100, ctx.currentTime);
                    masterGain.connect(ctx.destination);

                    if (type === 'test') {
                        // テスト音
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        // テスト音は極端に小さすぎたので少し上げる
                        gain.gain.setValueAtTime(0.2, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                        osc.frequency.setValueAtTime(440, ctx.currentTime);
                        osc.connect(gain);
                        gain.connect(masterGain); // masterGainに繋ぐ
                        osc.start();
                        osc.stop(ctx.currentTime + 0.2);
                    } else if (type === 'correct') {
                        // ピン・ポーン！ という2段階のチャイム音
                        const playChime = (time, freq, duration) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sine'; // 澄んだ音
                            osc.frequency.setValueAtTime(freq, time);
                            gain.gain.setValueAtTime(0.2, time);
                            gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                            osc.connect(gain);
                            gain.connect(masterGain);
                            osc.start(time);
                            osc.stop(time + duration);
                        };
                        
                        // 1音目：高め (ミ / E5)
                        playChime(ctx.currentTime, 659.25, 0.4);
                        // 2音目：少し低め (ド / C5) を少し遅れて鳴らす
                        playChime(ctx.currentTime + 0.15, 523.25, 0.6);
                    } else if (type === 'incorrect') {
                        // はっきりした「ブッ、ブー」というリズムの音
                        const playBuzzer = (time, duration) => {
                            const freq = 80;
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            
                            osc.type = 'sawtooth'; // 鋸歯状波
                            osc.frequency.setValueAtTime(freq, time);
                            
                            gain.gain.setValueAtTime(0.08, time); // 音量を少し大きく調整
                            gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                            
                            osc.connect(gain);
                            gain.connect(masterGain);
                            
                            osc.start(time);
                            osc.stop(time + duration);
                        };
                        
                        // 「ブッ、ブー」のリズムで再生
                        playBuzzer(ctx.currentTime, 0.1); // 1回目：短く「ブッ」
                        playBuzzer(ctx.currentTime + 0.15, 0.5); // 2回目：長く「ブー」
                    } else if (type === 'finish') {
                        // 終了時のキラキラした音 (ド・ミ・ソ・ド)
                        const playSparkle = (time, freq, duration) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, time);
                            gain.gain.setValueAtTime(0.2, time);
                            gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                            osc.connect(gain);
                            gain.connect(masterGain);
                            osc.start(time);
                            osc.stop(time + duration);
                        };
                        
                        const now = ctx.currentTime;
                        playSparkle(now, 523.25, 0.3); // C5
                        playSparkle(now + 0.1, 659.25, 0.3); // E5
                        playSparkle(now + 0.2, 783.99, 0.3); // G5
                        playSparkle(now + 0.3, 1046.50, 0.5); // C6
                    } else if (type === 'celebration') {
                        // お祝いのファンファーレ (ド・ミ・ソ・ド・ド↑)
                        const playNote = (time, freq, duration, type = 'sine') => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = type;
                            osc.frequency.setValueAtTime(freq, time);
                            gain.gain.setValueAtTime(0.2, time);
                            gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                            osc.connect(gain);
                            gain.connect(masterGain);
                            osc.start(time);
                            osc.stop(time + duration);
                        };
                        const now = ctx.currentTime;
                        playNote(now, 523.25, 0.2); // C5
                        playNote(now + 0.15, 659.25, 0.2); // E5
                        playNote(now + 0.3, 783.99, 0.2); // G5
                        playNote(now + 0.45, 1046.50, 0.2); // C6
                        playNote(now + 0.6, 1318.51, 0.8, 'triangle'); // E6 (キラキラ)
                    }
                } catch (e) {}
            };

            useEffect(() => {
                setIsReady(true);

                // モバイル向けの音声アンロック用リスナー
                // iOSではユーザーの「クリック」などの操作内で再生が必要
                const unlock = () => {
                    ensureAudioContext();
                    // 一度実行されたら解除
                    window.removeEventListener('touchstart', unlock);
                    window.removeEventListener('mousedown', unlock);
                    window.removeEventListener('click', unlock);
                };
                window.addEventListener('touchstart', unlock, { passive: false });
                window.addEventListener('mousedown', unlock);
                window.addEventListener('click', unlock);

                return () => {
                    window.removeEventListener('touchstart', unlock);
                    window.removeEventListener('mousedown', unlock);
                    window.removeEventListener('click', unlock);
                };
            }, []);

            const [selectedLevel, setSelectedLevel] = useState(1);
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [inputValue, setInputValue] = useState('');
            const [feedback, setFeedback] = useState(null);
            const [result, setResult] = useState(null);
            const [startTime, setStartTime] = useState(0);
            const [badges, setBadges] = useState(() => {
                try {
                    const saved = localStorage.getItem('kuku-star-badges');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            if (!isReady) {
                return (
                    <div className="flex justify-center items-center h-screen font-bold">
                        読み込み中...
                    </div>
                );
            }

            const shuffle = (array) => {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            };

            const startDrill = (level) => {
                ensureAudioContext();
                setSelectedLevel(level);
                const newQuestions = [];
                const seenPairs = new Set();
                
                if (typeof level === 'number') {
                    const bValues = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);
                    if (lastQuestionKey.current === `${level}x${bValues[0]}`) {
                        [bValues[0], bValues[bValues.length - 1]] = [bValues[bValues.length - 1], bValues[0]];
                    }
                    bValues.forEach((b, idx) => {
                        newQuestions.push({ id: `q-${idx}`, a: level, b, answer: level * b });
                    });
                } else {
                    let bOneCount = 0;
                    while (newQuestions.length < 10) {
                        let a, b;
                        if (level === 'random_1x1') {
                            a = Math.floor(Math.random() * 9) + 1;
                            b = Math.floor(Math.random() * 9) + 1;
                        } else {
                            a = Math.floor(Math.random() * 90) + 10;
                            b = Math.floor(Math.random() * 9) + 1;
                            if (b === 1 && bOneCount >= 1) {
                                b = Math.floor(Math.random() * 8) + 2;
                            }
                        }
                        const key = `${a}x${b}`;
                        const reverseKey = `${b}x${a}`;
                        if (newQuestions.length === 0 && (lastQuestionKey.current === key || lastQuestionKey.current === reverseKey)) continue;
                        if (!seenPairs.has(key) && !seenPairs.has(reverseKey)) {
                            if (level === 'random_2x1' && b === 1) bOneCount++;
                            seenPairs.add(key);
                            newQuestions.push({ id: `q-${newQuestions.length}`, a, b, answer: a * b });
                        }
                    }
                }
                setQuestions(newQuestions);
                setCurrentIndex(0);
                setInputValue('');
                setStartTime(Date.now());
                setView('drill');
            };

            const handleAnswerSubmit = () => {
                if (!inputValue) return;
                const answer = parseInt(inputValue);
                const updatedQuestions = [...questions];
                const isCorrect = answer === updatedQuestions[currentIndex].answer;
                updatedQuestions[currentIndex].userAnswer = answer;
                updatedQuestions[currentIndex].isCorrect = isCorrect;
                setQuestions(updatedQuestions);
                setFeedback(isCorrect ? 'correct' : 'incorrect');
                
                // 音を鳴らす
                playEffect(isCorrect ? 'correct' : 'incorrect');

                setTimeout(() => {
                    setFeedback(null);
                    setInputValue('');
                    if (currentIndex < questions.length - 1) {
                        setCurrentIndex(currentIndex + 1);
                    } else {
                        let timeTaken = Math.floor((Date.now() - startTime) / 1000);
                        let score = updatedQuestions.filter(q => q.isCorrect).length;
                        let accuracy = (score / updatedQuestions.length) * 100;
                        let badgeEarned = '';
                        let currentBadges = badges;
                        if (accuracy === 100 && typeof selectedLevel === 'number' && selectedLevel >= 1 && selectedLevel <= 9) {
                            badgeEarned = `${LEVEL_CONFIG[selectedLevel].name} 完ぺき!`;
                            if (!badges.includes(badgeEarned)) {
                                currentBadges = [...badges, badgeEarned];
                                setBadges(currentBadges);
                                try { localStorage.setItem('kuku-star-badges', JSON.stringify(currentBadges)); } catch(e) {}
                            }
                        }
                        const lastQ = updatedQuestions[updatedQuestions.length - 1];
                        lastQuestionKey.current = `${lastQ.a}x${lastQ.b}`;
                        
                        // 1のだん〜9のだんのバッジがすべて揃っているかチェック
                        const basicKukuNames = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `${LEVEL_CONFIG[n].name} 完ぺき!`);
                        const hasAllBasicBadges = basicKukuNames.every(name => currentBadges.includes(name));
                        // お祝い（isAllComplete）は九九のだん(1-9)の時に、全部揃っている場合のみ発生させる
                        const isAllComplete = hasAllBasicBadges && typeof selectedLevel === 'number' && selectedLevel >= 1 && selectedLevel <= 9;
                        // ランダムや大きな数での全問正解もお祝いする
                        const isSpecialPerfect = accuracy === 100 && (typeof selectedLevel !== 'number' || selectedLevel > 9);
                        
                        setResult({ score, total: updatedQuestions.length, timeTaken, accuracy, badgeEarned, isAllComplete, isSpecialPerfect });
                        
                        const shouldCelebrate = isAllComplete || isSpecialPerfect;
                        playEffect(shouldCelebrate ? 'celebration' : 'finish');
                        
                        if (shouldCelebrate) {
                            setTimeout(() => {
                                const duration = 3 * 1000;
                                const end = Date.now() + duration;
                                (function frame() {
                                    confetti({
                                        particleCount: 3,
                                        angle: 60,
                                        spread: 55,
                                        origin: { x: 0 },
                                        colors: ['#fbbf24', '#f59e0b', '#ffffff']
                                    });
                                    confetti({
                                        particleCount: 3,
                                        angle: 120,
                                        spread: 55,
                                        origin: { x: 1 },
                                        colors: ['#fbbf24', '#f59e0b', '#ffffff']
                                    });
                                    if (Date.now() < end) requestAnimationFrame(frame);
                                }());
                            }, 500);
                        }
                        setView('results');
                    }
                }, isCorrect ? 800 : 400);
            };

            const handleClearBadges = () => {
                if (window.confirm('あつめたバッジをすべて消してやりなおしますか？')) {
                    setBadges([]);
                    try { localStorage.removeItem('kuku-star-badges'); } catch(e) {}
                }
            };

            return (
                <div className="min-h-screen font-sans bg-orange-50 overflow-x-hidden relative">
                    <div className="fixed inset-0 pointer-events-none opacity-10 flex flex-wrap gap-12 p-8 overflow-hidden">
                         {[...Array(60)].map((_, i) => (<div key={i} className="text-orange-300 text-xl">🌟</div>))}
                    </div>

                    <AnimatePresence mode="wait">
                        {view === 'menu' && (
                            <MenuView key="menu" onStart={startDrill} badges={badges} volume={volume} setVolume={setVolume} onClearBadges={handleClearBadges} />
                        )}
                        {view === 'drill' && (
                            <DrillView 
                                key="drill" level={selectedLevel} question={questions[currentIndex]}
                                currentIndex={currentIndex} total={questions.length}
                                inputValue={inputValue} setInputValue={setInputValue}
                                feedback={feedback} onSubmit={handleAnswerSubmit} onBack={() => setView('menu')}
                            />
                        )}
                        {view === 'results' && result && (
                            <ResultsView 
                                key="results" level={selectedLevel} result={result}
                                questions={questions} onRestart={() => startDrill(selectedLevel)} onMenu={() => setView('menu')}
                            />
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        function MenuView({ onStart, badges, volume, setVolume, onClearBadges }) {
            return (
                <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} className="max-w-xl md:max-w-2xl lg:max-w-4xl mx-auto px-4 lg:px-8 py-4 lg:py-4 relative z-10">
                    <div className="text-center mb-2 lg:mb-2">
                        <motion.h1 animate={{ scale: [1, 1.02, 1] }} transition={{ duration: 4, repeat: Infinity }} className="text-3xl md:text-5xl lg:text-5xl font-black text-orange-500 tracking-tight drop-shadow-sm mb-0">
                            KUKU STAR
                        </motion.h1>
                        <p className="text-slate-400 font-bold text-[10px] md:text-xs lg:text-sm">九九をマスターして🌟をあつめよう！</p>
                    </div>

                    <div className="mb-2 lg:mb-2 bg-white/50 py-1 lg:py-2 px-3 lg:px-6 rounded-xl lg:rounded-2xl border border-orange-100/50 shadow-sm backdrop-blur-sm max-w-[200px] md:max-w-[220px] lg:max-w-[240px] mx-auto">
                        <div className="flex items-center gap-2 lg:gap-4">
                            <div className="w-3 h-3 lg:w-5 lg:h-5 opacity-60 flex items-center justify-center">
                                {volume === 0 ? (
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-full h-full">
                                        <path d="M11 5L6 9H2v6h4l5 4V5z" />
                                        <line x1="2" y1="2" x2="22" y2="22" />
                                    </svg>
                                ) : (
                                    <span className="text-[10px] lg:text-base">🔊</span>
                                )}
                            </div>
                            <input 
                                type="range" min="0" max="100" value={volume} 
                                onChange={(e) => {
                                    const val = parseInt(e.target.value);
                                    setVolume(val);
                                    playEffect('test', val);
                                }}
                                className="flex-1 h-1 lg:h-2 bg-orange-100/50 rounded-lg appearance-none cursor-pointer accent-orange-400"
                            />
                            <span className="text-orange-600/70 font-bold text-[9px] lg:text-xs min-w-[20px] lg:min-w-[30px] text-right">{volume}%</span>
                        </div>
                        <p className="text-[8px] lg:text-[10px] text-slate-400 mt-1 font-medium text-center">※マナーモードを解除して楽しんでね！</p>
                    </div>

                    <div className="space-y-3 lg:space-y-3">
                        <div className="bg-white/50 p-3 lg:p-4 rounded-[1.5rem] lg:rounded-[2rem] border border-orange-100/50 backdrop-blur-sm">
                            <h2 className="text-[11px] md:text-sm lg:text-lg font-black text-slate-500 mb-2 lg:mb-3 px-1 flex items-center gap-2 lg:gap-3">
                                <span className="bg-amber-400 text-white w-4 h-4 lg:w-6 lg:h-6 rounded-full flex items-center justify-center text-[9px] lg:text-sm">🌟</span>
                                九九のだん
                            </h2>
                            <div className="grid grid-cols-3 gap-1.5 lg:gap-3">
                                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((lv) => (
                                    <button
                                        key={lv} onClick={() => onStart(lv)}
                                        className={`${LEVEL_CONFIG[lv].color} h-12 md:h-20 lg:h-16 rounded-xl lg:rounded-2xl flex flex-col items-center justify-center text-white shadow-md transition-all hover:brightness-105 active:scale-95 cursor-pointer border-b-2 lg:border-b-4 border-black/10`}
                                    >
                                        <span className="text-lg md:text-2xl lg:text-2xl leading-none mb-0.5 lg:mb-1">{LEVEL_CONFIG[lv].icon}</span>
                                        <span className="font-extrabold text-[10px] md:text-sm lg:text-base">{LEVEL_CONFIG[lv].name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="bg-yellow-400/10 rounded-xl lg:rounded-2xl p-3 lg:p-4 border border-yellow-200/50">
                            <div className="flex justify-between items-center mb-3 px-1">
                                <div className="flex flex-col lg:flex-row lg:items-center gap-1 lg:gap-3">
                                    <h2 className="text-[10px] lg:text-base font-black text-yellow-700 flex items-center gap-1.5 lg:gap-2 uppercase tracking-wider">
                                        🏆 あつめた🌟
                                    </h2>
                                    {[1, 2, 3, 4, 5, 6, 7, 8, 9].every(num => badges.includes(`${LEVEL_CONFIG[num].name} 完ぺき!`)) && (
                                        <motion.span 
                                            initial={{ opacity: 0, x: -10 }} 
                                            animate={{ opacity: 1, x: 0 }}
                                            className="text-[9px] lg:text-sm font-black text-orange-500 bg-white/80 px-2 py-0.5 rounded-full shadow-sm whitespace-nowrap"
                                        >
                                            ✨ ぜんぶかんぺき！がんばったね！
                                        </motion.span>
                                    )}
                                </div>
                                {badges.length > 0 && (
                                    <button 
                                        onClick={onClearBadges}
                                        className="text-[8px] lg:text-xs font-bold text-slate-400 hover:text-rose-400 transition-colors flex items-center gap-1 lg:gap-2"
                                    >
                                        <span className="lg:text-base">🗑️</span> クリア
                                    </button>
                                )}
                            </div>
                            <div className="grid grid-cols-9 gap-1 lg:gap-2">
                                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) => {
                                    const isMastered = badges.includes(`${LEVEL_CONFIG[num].name} 完ぺき!`);
                                    return (
                                        <div key={num} className="flex flex-col items-center gap-1">
                                            <motion.div 
                                                initial={false}
                                                animate={{ 
                                                    scale: isMastered ? [1, 1.2, 1] : 1,
                                                    filter: isMastered ? 'grayscale(0%)' : 'grayscale(100%)',
                                                    opacity: isMastered ? 1 : 0.3
                                                }}
                                                className={`text-xl lg:text-3xl ${isMastered ? 'drop-shadow-[0_0_8px_rgba(250,204,21,0.6)]' : ''}`}
                                            >
                                                🌟
                                            </motion.div>
                                            <span className={`text-[8px] lg:text-[10px] font-bold ${isMastered ? 'text-yellow-600' : 'text-slate-300'}`}>
                                                {num}のだん
                                            </span>
                                        </div>
                                    );
                                })}
                            </div>
                            
                            {/* その他（ランダムなど）のバッジがあれば下段に表示 */}
                            {badges.filter(b => !b.includes('のだん')).length > 0 && (
                                <div className="mt-4 pt-3 border-t border-yellow-200/30 flex flex-wrap gap-1 lg:gap-2">
                                    {badges.filter(b => !b.includes('のだん')).map((b, i) => (
                                        <motion.div key={i} initial={{ scale: 0 }} animate={{ scale: 1 }} className="bg-white border border-yellow-100 text-yellow-700 px-2 lg:px-3 py-0.5 lg:py-1 rounded-full text-[8px] lg:text-sm font-bold shadow-sm flex items-center gap-0.5 lg:gap-1">
                                            <span className="lg:text-base">🌟</span> {b}
                                        </motion.div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 lg:gap-4">
                            <div className="bg-white/50 p-3 lg:p-4 rounded-[1.5rem] lg:rounded-[2rem] border border-orange-100/50 backdrop-blur-sm">
                                <h2 className="text-[11px] lg:text-lg font-black text-slate-500 mb-2 lg:mb-3 px-1 flex items-center gap-2 lg:gap-3">
                                    <span className="bg-teal-400 text-white w-4 h-4 lg:w-6 lg:h-6 rounded-full flex items-center justify-center text-[9px] lg:text-sm">✨</span>
                                    おおきな数
                                </h2>
                                <div className="grid grid-cols-2 gap-1.5 lg:gap-3">
                                    {[10, 100].map((lv) => (
                                        <button
                                            key={lv} onClick={() => onStart(lv)}
                                            className={`${LEVEL_CONFIG[lv].color} h-10 lg:h-12 rounded-xl lg:rounded-2xl flex items-center justify-center gap-1.5 lg:gap-3 text-white shadow-md transition-all hover:brightness-105 active:scale-95 cursor-pointer`}
                                        >
                                            <span className="text-base lg:text-xl">{LEVEL_CONFIG[lv].icon}</span>
                                            <span className="font-black text-[10px] lg:text-base">{LEVEL_CONFIG[lv].name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white/50 p-3 lg:p-4 rounded-[1.5rem] lg:rounded-[2rem] border border-orange-100/50 backdrop-blur-sm">
                                <h2 className="text-[11px] lg:text-lg font-black text-slate-500 mb-2 lg:mb-3 px-1 flex items-center gap-2 lg:gap-3">
                                    <span className="bg-indigo-400 text-white w-4 h-4 lg:w-6 lg:h-6 rounded-full flex items-center justify-center text-[9px] lg:text-sm">🚀</span>
                                    ランダム
                                </h2>
                                <div className="grid grid-cols-2 gap-1.5 lg:gap-3">
                                    {['random_1x1', 'random_2x1'].map((lv) => (
                                        <button
                                            key={lv} onClick={() => onStart(lv)}
                                            className={`${LEVEL_CONFIG[lv].color} h-10 lg:h-12 rounded-xl lg:rounded-2xl flex items-center justify-center gap-1.5 lg:gap-3 text-white shadow-md transition-all hover:brightness-105 active:scale-95 cursor-pointer`}
                                        >
                                            <span className="text-base lg:text-xl">{LEVEL_CONFIG[lv].icon}</span>
                                            <span className="font-black text-[10px] lg:text-base">{LEVEL_CONFIG[lv].name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                    </div>
                </motion.div>
            );
        }

        function DrillView({ level, question, currentIndex, total, inputValue, setInputValue, feedback, onSubmit, onBack }) {
            const addNumber = (num) => {
                if (inputValue.length < 3) setInputValue(inputValue + num);
            };
            return (
                <div className={`min-h-screen ${LEVEL_CONFIG[level].color} flex flex-col p-2 lg:p-4 relative overflow-hidden transition-colors duration-500`}>
                    <AnimatePresence>
                        {feedback === 'correct' && (
                            <motion.div initial={{ scale: 0, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 1.5, opacity: 0 }} className="absolute inset-0 flex items-center justify-center z-50 pointer-events-none">
                                <div className="bg-white px-6 lg:px-12 py-3 lg:py-6 rounded-full shadow-2xl border-4 lg:border-8 border-yellow-300">
                                    <span className="text-3xl md:text-5xl lg:text-7xl font-black text-orange-500 text-center block">せいかい！</span>
                                </div>
                            </motion.div>
                        )}
                        {feedback === 'incorrect' && (
                            <motion.div initial={{ x: -20, opacity: 0 }} animate={{ x: [0, -10, 10, -10, 10, 0], opacity: 1 }} exit={{ opacity: 0 }} className="absolute inset-0 flex items-center justify-center z-50 pointer-events-none">
                                <div className="bg-white px-6 lg:px-12 py-3 lg:py-6 rounded-2xl lg:rounded-[3rem] shadow-2xl border-4 lg:border-8 border-slate-300">
                                    <span className="text-3xl md:text-5xl lg:text-8xl font-black text-slate-500 text-center block">ざんねん</span>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    <div className="max-w-sm md:max-w-md lg:max-w-xl mx-auto w-full flex-1 flex flex-col">
                        <div className="flex justify-between items-center text-white mb-2 lg:mb-2 pt-2 lg:pt-0">
                            <button onClick={onBack} className="text-xs md:text-sm lg:text-xl font-bold bg-black/10 px-3 md:px-4 lg:px-6 py-1 lg:py-2 rounded-full">戻る</button>
                            <div className="bg-white/20 px-3 md:px-4 lg:px-6 py-1 lg:py-2 rounded-full font-black text-xs md:text-sm lg:text-xl">
                                {currentIndex + 1} / {total}
                            </div>
                        </div>
                        <div className="flex-1 flex flex-col justify-center items-center">
                            <motion.div key={question.id} initial={{ scale: 0.95, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="w-full bg-white rounded-[2rem] lg:rounded-[2rem] p-4 lg:p-6 shadow-2xl flex flex-col items-center">
                                <div className="flex items-center gap-3 lg:gap-6 mb-4 lg:mb-6">
                                    <span className="text-3xl md:text-5xl lg:text-6xl font-black text-slate-800 tabular-nums">{question.a}</span>
                                    <span className="text-xl md:text-3xl lg:text-4xl font-bold text-slate-200">×</span>
                                    <span className="text-3xl md:text-5xl lg:text-6xl font-black text-slate-800 tabular-nums">{question.b}</span>
                                    <span className="text-xl md:text-3xl lg:text-4xl font-bold text-slate-200">＝</span>
                                </div>
                                <div className="w-full max-w-[220px] md:max-w-xs lg:max-w-sm">
                                    <div className="w-full text-3xl md:text-5xl lg:text-5xl font-black p-2 lg:p-4 rounded-xl lg:rounded-2xl bg-slate-50 text-orange-500 min-h-[50px] md:min-h-[70px] lg:min-h-[60px] flex items-center justify-center mb-4 lg:mb-6 border-2 lg:border-4 border-slate-100">
                                        {inputValue || <span className="text-slate-200">?</span>}
                                    </div>
                                    <div className="grid grid-cols-3 gap-1.5 lg:gap-3">
                                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) => (
                                            <button key={num} onClick={() => addNumber(num)} className="bg-slate-50 text-slate-700 font-black text-lg md:text-2xl lg:text-2xl py-2 md:py-3 lg:py-3 rounded-lg lg:rounded-xl active:scale-90 transition-all border border-slate-100 shadow-sm">{num}</button>
                                        ))}
                                        <button onClick={() => setInputValue('')} className="bg-rose-50 text-rose-500 font-black text-xs md:text-lg lg:text-lg py-2 md:py-3 lg:py-3 rounded-lg lg:rounded-xl active:scale-95 shadow-sm">けす</button>
                                        <button onClick={() => addNumber(0)} className="bg-slate-50 text-slate-700 font-black text-lg md:text-2xl lg:text-2xl py-2 md:py-3 lg:py-3 rounded-lg lg:rounded-xl active:scale-95 shadow-sm">0</button>
                                        <button onClick={onSubmit} className="bg-orange-500 text-white font-black text-lg md:text-2xl lg:text-2xl py-2 md:py-3 lg:py-3 rounded-lg lg:rounded-xl shadow-lg active:scale-95">OK</button>
                                    </div>
                                </div>
                            </motion.div>
                        </div>
                    </div>
                </div>
            );
        }

        function ResultsView({ level, result, questions, onRestart, onMenu }) {
            const isPerfect = result.accuracy === 100;
            const isAllComplete = result.isAllComplete;
            const incorrectQs = questions.filter(q => !q.isCorrect);
            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="min-h-screen bg-white flex items-center justify-center p-2 lg:p-4 overflow-y-auto">
                    <div className="max-w-xs md:max-w-sm lg:max-w-md w-full bg-orange-50 rounded-[2rem] lg:rounded-[2rem] p-4 lg:p-6 shadow-xl text-center border-2 lg:border-6 border-white relative overflow-hidden">
                        {isAllComplete && (
                            <motion.div initial={{ opacity: 0, scale: 0.8 }} animate={{ opacity: 1, scale: 1 }} className="absolute inset-0 bg-yellow-400 flex flex-col items-center justify-center z-20 p-4 lg:p-6">
                                <div className="text-5xl md:text-6xl lg:text-6xl mb-2 lg:mb-4">👑</div>
                                <h2 className="text-xl md:text-2xl lg:text-2xl font-black text-white mb-1 lg:mb-2 leading-tight">ぜんぶクリア！<br/>おめでとう！</h2>
                                <p className="text-yellow-100 font-bold mb-4 lg:mb-6 text-xs md:text-sm lg:text-lg">九九マスターのあかしを<br/>てにいれたね！</p>
                                <button onClick={onMenu} className="w-full py-3 md:py-4 lg:py-4 rounded-xl lg:rounded-2xl bg-white text-yellow-600 font-black text-base md:text-xl lg:text-xl shadow-lg active:scale-95">メニューへもどる</button>
                            </motion.div>
                        )}
                        <div className="text-4xl md:text-5xl lg:text-5xl mb-2 lg:mb-2">{isPerfect ? '🏅' : LEVEL_CONFIG[level].icon}</div>
                        <h2 className="text-lg md:text-2xl lg:text-2xl font-black text-slate-800 mb-0.5 lg:mb-0.5">{isPerfect ? '完ぺき！' : 'おつかれさま！'}</h2>
                        <p className="text-slate-400 font-bold mb-4 lg:mb-4 text-[10px] md:text-sm lg:text-sm">{LEVEL_CONFIG[level].name} のけっか</p>
                        <div className="grid grid-cols-2 gap-2 lg:gap-4 mb-4 lg:mb-4">
                            <div className="bg-white rounded-xl lg:rounded-2xl p-2 lg:p-4 shadow-sm border border-orange-100">
                                <p className="text-slate-300 font-black text-[8px] md:text-xs lg:text-xs mb-0.5 lg:mb-1">せいかい</p>
                                <p className="text-lg md:text-2xl lg:text-2xl font-black text-slate-800">{result.score} / {result.total}</p>
                            </div>
                            <div className="bg-white rounded-xl lg:rounded-2xl p-2 lg:p-4 shadow-sm border border-orange-100">
                                <p className="text-slate-300 font-black text-[8px] md:text-xs lg:text-xs mb-0.5 lg:mb-1">じかん</p>
                                <p className="text-base md:text-xl lg:text-2xl font-black text-slate-800 whitespace-nowrap">
                                    {Math.floor(result.timeTaken / 60) > 0 ? `${Math.floor(result.timeTaken / 60)}ふん` : ''}
                                    {result.timeTaken % 60}びょう
                                </p>
                            </div>
                        </div>
                        {result.badgeEarned && (
                            <div className="bg-yellow-400 text-white p-2 lg:p-3 rounded-lg lg:rounded-xl mb-4 lg:mb-4 shadow-md">
                                <p className="font-black text-[8px] lg:text-xs">✨ NEW BADGE ✨</p>
                                <p className="text-xs lg:text-lg font-black">{result.badgeEarned}</p>
                            </div>
                        )}
                        <div className="space-y-1.5 lg:space-y-2 mb-4 lg:mb-4">
                            <button onClick={onRestart} className={`${LEVEL_CONFIG[level].color} w-full py-2.5 lg:py-3 rounded-lg lg:rounded-xl text-white font-black text-xs lg:text-lg shadow-md active:scale-95`}>もう一回！</button>
                            <button onClick={onMenu} className="w-full py-2.5 lg:py-3 rounded-lg lg:rounded-xl bg-white text-slate-400 font-black text-xs lg:text-lg border border-slate-100 active:scale-95">メニュー</button>
                        </div>
                        {incorrectQs.length > 0 && (
                            <div className="text-left border-t border-orange-100 pt-2 lg:pt-2">
                                <h3 className="text-rose-500 font-black mb-1 lg:mb-2 text-[8px] lg:text-xs uppercase tracking-wider">Review Mistake</h3>
                                <div className="space-y-1 lg:space-y-2 max-h-24 lg:max-h-32 overflow-y-auto pr-1 custom-scrollbar">
                                    {incorrectQs.map((q, i) => (
                                        <div key={i} className="bg-white p-1.5 lg:p-2 rounded lg:rounded-lg flex items-center justify-between font-bold text-slate-700 text-[10px] lg:text-sm">
                                            <span>{q.a} × {q.b} ＝ {q.answer}</span>
                                            <span className="text-rose-300 text-[9px] lg:text-xs">Mistake: {q.userAnswer}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </motion.div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
